<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="utf-8">
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
    <meta name="viewport" content="width=device-width, height=device-height, initial-scale=1.0, user-scalable=no, shrink-to-fit=yes">
    <title>{{{ PRODUCT_NAME }}}</title>
    <style>
      html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; background: #05070b; }
      #unity-container, #unity-container.unity-desktop { position: fixed !important; left: 0 !important; top: 0 !important; transform: none !important; width: 100% !important; height: 100% !important; }
      #unity-canvas { width: 100% !important; height: 100% !important; display: block; background: #000; outline: none; }
      #unity-footer { display: none !important; }

      /* 첫 로딩 화면: 게임 엔딩 화면과 같은 느낌(검은 바탕 + 민트 도트 로고 + 얇은 도트 막대) */
      #loading {
        position: fixed; inset: 0; z-index: 10;
        display: flex; flex-direction: column; align-items: center; justify-content: center;
        background: #05060a;
        color: #e6eef0; font-family: "Malgun Gothic", "Apple SD Gothic Neo", sans-serif;
        transition: opacity .6s ease;
      }
      #loading.done { opacity: 0; pointer-events: none; }
      #loading .logo { width: min(560px, 76vw); height: auto; image-rendering: pixelated; image-rendering: crisp-edges; }
      #loading .tag { margin-top: 18px; font-size: clamp(14px, 2.2vw, 20px); color: #60fbcb; letter-spacing: .08em; }
      #loading .bar { margin-top: 56px; width: min(420px, 70vw); height: 12px; background: #151a22; box-shadow: 0 0 0 3px #05060a, 0 0 0 6px #2b3442; }
      #loading .fill { height: 100%; width: 0%; background: #60fbcb; transition: width .2s linear; }
      #loading .pct { margin-top: 14px; font-size: 16px; color: #cfe9e2; min-height: 22px; letter-spacing: .05em; }
      #loading .note { position: absolute; bottom: 7vh; left: 0; right: 0; font-size: clamp(12px, 1.8vw, 15px); color: #a8b4c4; text-align: center; padding: 0 16px; line-height: 1.6; }
      #loading .err { color: #ff8c80; }
    </style>
  </head>
  <body>
    <div id="unity-container" class="unity-desktop">
      <canvas id="unity-canvas" tabindex="-1"></canvas>
    </div>
    <div id="loading">
      <img class="logo" src="logo.png" alt="STRANGER">
      <div class="tag">낯선 말, 하나가 되는 길</div>
      <div class="bar"><div class="fill" id="loading-fill"></div></div>
      <div class="pct" id="loading-pct">0%</div>
      <div class="note" id="loading-note">처음 로딩은 조금 걸려요. 다음부터는 더 빨라요.</div>
    </div>
    <script>
      var canvas = document.querySelector("#unity-canvas");
      var loading = document.querySelector("#loading");
      var fill = document.querySelector("#loading-fill");
      var pct = document.querySelector("#loading-pct");
      var note = document.querySelector("#loading-note");

      function showBanner(msg, type) {
        if (type === 'error') { note.textContent = msg; note.className = 'note err'; loading.classList.remove('done'); }
        else console.warn(msg);
      }

      var buildUrl = "Build";
      var loaderUrl = buildUrl + "/{{{ LOADER_FILENAME }}}";
      var config = {
        arguments: [],
        dataUrl: buildUrl + "/{{{ DATA_FILENAME }}}",
        frameworkUrl: buildUrl + "/{{{ FRAMEWORK_FILENAME }}}",
#if USE_WASM
        codeUrl: buildUrl + "/{{{ CODE_FILENAME }}}",
#endif
#if SYMBOLS_FILENAME
        symbolsUrl: buildUrl + "/{{{ SYMBOLS_FILENAME }}}",
#endif
        streamingAssetsUrl: "StreamingAssets",
        companyName: {{{ JSON.stringify(COMPANY_NAME) }}},
        productName: {{{ JSON.stringify(PRODUCT_NAME) }}},
        productVersion: {{{ JSON.stringify(PRODUCT_VERSION) }}},
        showBanner: showBanner,
      };

      if (/iPhone|iPad|iPod|Android/i.test(navigator.userAgent)) {
        var meta = document.createElement('meta');
        meta.name = 'viewport';
        meta.content = 'width=device-width, height=device-height, initial-scale=1.0, user-scalable=no, shrink-to-fit=yes';
        document.getElementsByTagName('head')[0].appendChild(meta);
        document.querySelector("#unity-container").className = "unity-mobile";
        note.textContent = "처음 로딩은 조금 걸려요. 휴대폰은 가로로 돌려 주세요.";
      }

      // 키보드 포커스: 클릭·터치하면 캔버스로 (iframe 안에서도 방향키/WASD 가 먹도록)
      function focusGame() { try { window.focus(); canvas.focus(); } catch (e) {} }
      window.addEventListener('mousedown', focusGame);
      window.addEventListener('touchstart', focusGame);
      window.addEventListener('keydown', function (e) { if (['ArrowUp','ArrowDown','ArrowLeft','ArrowRight',' '].indexOf(e.key) >= 0) e.preventDefault(); }, { passive: false });
      setTimeout(focusGame, 500);

      var script = document.createElement("script");
      script.src = loaderUrl;
      script.onload = function () {
        createUnityInstance(canvas, config, function (progress) {
          var p = Math.round(progress * 100);
          fill.style.width = p + "%";
          pct.textContent = p >= 90 && p < 100 ? "거의 다 됐어요 · " + p + "%" : p + "%";
        }).then(function (unityInstance) {
          fill.style.width = "100%"; pct.textContent = "100%";
          loading.classList.add('done');
          setTimeout(function () { loading.style.display = 'none'; }, 700);
          focusGame();
        }).catch(function (message) {
          showBanner("불러오지 못했어요. 새로고침해 주세요. (" + message + ")", 'error');
        });
      };
      script.onerror = function () { showBanner("게임 파일을 받지 못했어요. 인터넷을 확인하고 새로고침해 주세요.", 'error'); };
      document.body.appendChild(script);
    </script>
  </body>
</html>
